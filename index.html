<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Car Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 10px;
    }

    #game {
      position: relative;
      width: 400px;
      height: 600px;
      margin: auto;
      overflow: hidden;
      background: #555;
      border-left: 8px solid #333;
      border-right: 8px solid #333;
    }

    /* Road lines */
    .line {
      position: absolute;
      width: 10px;
      height: 80px;
      background: white;
      left: 195px;
    }

    /* Player car */
    #player {
      position: absolute;
      width: 50px;
      height: 90px;
      background: red;
      bottom: 20px;
      left: 175px;
      border-radius: 10px;
      z-index: 2;
    }

    #player::before,
    #player::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 25px;
      background: black;
      top: 10px;
    }

    #player::before {
      left: -6px;
    }

    #player::after {
      right: -6px;
    }

    /* Enemy cars */
    .enemy {
      position: absolute;
      width: 50px;
      height: 90px;
      background: blue;
      border-radius: 10px;
    }

    .enemy::before,
    .enemy::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 25px;
      background: black;
      bottom: 10px;
    }

    .enemy::before {
      left: -6px;
    }

    .enemy::after {
      right: -6px;
    }

    #score {
      font-size: 22px;
      margin: 10px;
    }

    #gameOver {
      display: none;
      position: absolute;
      width: 100%;
      top: 220px;
      background: rgba(0, 0, 0, 0.85);
      padding: 30px 0;
      z-index: 10;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #00c853;
      color: white;
    }
  </style>
</head>

<body>

  <h1>🏎️ 2D Car Game</h1>
  <div id="score">Score: 0</div>

  <div id="game">

    <div id="player"></div>

    <div id="gameOver">
      <h2>💥 Game Over!</h2>
      <p id="finalScore"></p>
      <button onclick="restartGame()">Play Again</button>
    </div>

  </div>

  <script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const scoreText = document.getElementById("score");
    const gameOverScreen = document.getElementById("gameOver");
    const finalScore = document.getElementById("finalScore");

    let playerX = 175;
    let score = 0;
    let gameSpeed = 5;
    let gameRunning = true;

    const keys = {};

    document.addEventListener("keydown", (event) => {
      keys[event.key] = true;
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key] = false;
    });

    // Create road lines
    const lines = [];

    for (let i = 0; i < 6; i++) {
      const line = document.createElement("div");
      line.classList.add("line");
      line.style.top = (i * 120) + "px";
      game.appendChild(line);
      lines.push(line);
    }

    // Create enemy cars
    const enemies = [];

    function createEnemy() {
      const enemy = document.createElement("div");
      enemy.classList.add("enemy");

      const lanes = [75, 175, 275];
      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

      enemy.style.left = randomLane + "px";
      enemy.style.top = "-100px";

      game.appendChild(enemy);
      enemies.push(enemy);
    }

    createEnemy();

    function movePlayer() {
      if (keys["ArrowLeft"] || keys["a"]) {
        playerX -= 6;
      }

      if (keys["ArrowRight"] || keys["d"]) {
        playerX += 6;
      }

      // Keep player inside road
      if (playerX < 10) {
        playerX = 10;
      }

      if (playerX > 340) {
        playerX = 340;
      }

      player.style.left = playerX + "px";
    }

    function moveRoad() {
      lines.forEach(line => {
        let top = parseInt(line.style.top);

        top += gameSpeed;

        if (top > 600) {
          top = -80;
        }

        line.style.top = top + "px";
      });
    }

    function moveEnemies() {
      enemies.forEach((enemy, index) => {

        let top = parseInt(enemy.style.top);

        top += gameSpeed;

        enemy.style.top = top + "px";

        // Remove enemy after leaving screen
        if (top > 600) {
          enemy.remove();
          enemies.splice(index, 1);

          score++;
          scoreText.textContent = "Score: " + score;

          // Increase difficulty
          if (score % 5 === 0) {
            gameSpeed += 0.5;
          }

          createEnemy();
        }

        checkCollision(enemy);
      });
    }

    function checkCollision(enemy) {
      const playerRect = player.getBoundingClientRect();
      const enemyRect = enemy.getBoundingClientRect();

      if (
        playerRect.left < enemyRect.right &&
        playerRect.right > enemyRect.left &&
        playerRect.top < enemyRect.bottom &&
        playerRect.bottom > enemyRect.top
      ) {
        endGame();
      }
    }

    function endGame() {
      gameRunning = false;

      finalScore.textContent = "Your score: " + score;

      gameOverScreen.style.display = "block";
    }

    function restartGame() {
      // Remove enemy cars
      enemies.forEach(enemy => enemy.remove());
      enemies.length = 0;

      playerX = 175;
      score = 0;
      gameSpeed = 5;
      gameRunning = true;

      player.style.left = playerX + "px";

      scoreText.textContent = "Score: 0";

      gameOverScreen.style.display = "none";

      createEnemy();

      gameLoop();
    }

    function gameLoop() {
      if (!gameRunning) return;

      movePlayer();
      moveRoad();
      moveEnemies();

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
